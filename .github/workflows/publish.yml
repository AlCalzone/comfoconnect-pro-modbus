name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (e.g. 0.1.0)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the tag is a release version
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' is not a version such as 0.1.0"
            exit 1
          fi
          if [[ "$RELEASE_TAG" == "0.0.0" ]]; then
            echo "::error::0.0.0 is the placeholder version and cannot be released"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A tag ref only, so a branch with a version-like name cannot be built
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          enable-cache: false
      - name: Set package version from release tag
        run: |
          uv version --frozen "$RELEASE_TAG"
          test "$(uv version --short)" = "$RELEASE_TAG"
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # A manual run must start from the tag, so a branch's copy of this file
    # cannot reach the PyPI token.
    if: github.ref_type == 'tag' || github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
